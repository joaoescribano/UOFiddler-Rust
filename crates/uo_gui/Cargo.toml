[package]
name = "uo_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
uo_core = { path = "../uo_core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15" # File dialog for selecting UO directory
egui-phosphor = "0.7" # Icon font for the map editor UI (0.7.x targets egui 0.29)
